name: ROCm GPU Benchmark

on:
  workflow_dispatch:
    inputs:
      ops:
        description: >-
          Comma-separated operator ids to benchmark (keys of OP_TEST_CONFIGS in
          run_flagsparse_pytest.py). Leave empty to run all configured
          operators from conf/operators.yaml.
        required: false
        type: string
      matrix_dir:
        description: MatrixMarket file or directory used by mtx-backed suites
        required: true
        default: tests/data
        type: string
      warmup:
        description: Warmup iterations for suites that support it
        required: true
        default: "5"
        type: string
      iters:
        description: Timed iterations for suites that support it
        required: true
        default: "20"
        type: string
      use_hipsparse:
        description: Include hipSPARSE baselines when available on the runner
        required: true
        default: false
        type: boolean

jobs:
  benchmark:
    name: Run ROCm/DCU GPU benchmark
    runs-on:
      - self-hosted
      - linux
      - gpu
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize artifact paths
        run: mkdir -p benchmark_results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci/requirements-triton-smoke.lock.txt

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade -r tools/ci/requirements-triton-smoke.lock.txt

      - name: Validate ROCm/DCU environment
        run: |
          rocm-smi || true
          python tools/ci/check_gpu_environment.py \
            --require-rocm \
            --metadata benchmark_results/gpu_metadata.json

      - name: Build source and wheel distributions
        run: python -m build

      - name: Install package
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Validate installed wheel import
        run: python tools/ci/check_installed_wheel.py --expected-version 1.0.0

      - name: Run selected GPU benchmark suite
        shell: bash
        run: |
          args=(
            run_flagsparse_performance.py
            --benchmark-input "${{ inputs.matrix_dir }}"
            --benchmark-warmup "${{ inputs.warmup }}"
            --benchmark-iters "${{ inputs.iters }}"
            --gpus 0
            --results-dir benchmark_results
          )
          if [ -n "${{ inputs.ops }}" ]; then
            args+=(--ops "${{ inputs.ops }}")
          fi
          if [ "${{ inputs.use_hipsparse }}" != "true" ]; then
            args+=(--benchmark-args "--no-hipsparse")
          fi
          python "${args[@]}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark-${{ github.run_id }}
          path: benchmark_results/
